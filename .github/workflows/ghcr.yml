# Build & push a GHCR.
# - main  → Environment production → :latest (+ webhook Dokploy fijo)
# - develop / workflow_dispatch → Environment prueba → :prueba

name: GHCR — Build & Push

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de deploy"
        required: true
        type: choice
        options:
          - production
          - prueba
        default: prueba

concurrency:
  group: ghcr-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'production' || 'prueba') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            DEPLOY_ENV="production"
          else
            DEPLOY_ENV="prueba"
          fi
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "Entorno: $DEPLOY_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.env.outputs.DEPLOY_ENV == 'production' }}
            type=raw,value=prueba,enable=${{ steps.env.outputs.DEPLOY_ENV == 'prueba' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Require Server Actions encryption key
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          DEPLOY_ENV: ${{ steps.env.outputs.DEPLOY_ENV }}
        run: |
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ]; then
            echo "::error::Falta el secret NEXT_SERVER_ACTIONS_ENCRYPTION_KEY en el Environment '$DEPLOY_ENV'."
            echo "Genera una con: openssl rand -base64 32"
            echo "Añádela en Settings → Environments → $DEPLOY_ENV → Secrets."
            exit 1
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}

      - name: Trigger Dokploy redeploy
        if: success() && steps.env.outputs.DEPLOY_ENV == 'production'
        continue-on-error: true
        run: |
          echo "Disparando redeploy Dokploy (production)…"
          curl -fsS -X POST "https://server.fastery.dev/api/deploy/AOMm3dC6SGSF2UKY5q6bS" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"ghcr\",\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\",\"image\":\"${REGISTRY}/${IMAGE_NAME}:latest\",\"environment\":\"production\"}"
